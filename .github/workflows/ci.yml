name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Build and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The site list matches the metas
        run: |
          python3 tools/build.py
          git diff --exit-code -- providers/index.js manifest.json || {
            echo "::error::providers/index.js or manifest.json is out of date. Run python3 tools/build.py and commit the result."
            exit 1
          }
      - name: Nothing personal in the repository
        run: python3 tools/privacy_check.py
      - name: Every script parses
        run: for f in *.js providers/*.js; do node --check "$f" || exit 1; done

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run the tests
        run: python -m pytest -q -n auto --dist loadfile --tb=short
