<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Statement Sweep</title>
<link rel="stylesheet" href="ui.css">
<style>
  html { background: var(--window); }
  body { display: flex; flex-direction: column; width: 360px; max-height: 600px; margin: 0; }
  header { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 14px 16px 12px; border-bottom: 1px solid var(--separator); }
  h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
  #summary { grid-column: 1; margin: 0; color: var(--secondary); font-size: 12px; line-height: 16px; }
  #summary[data-kind=attention] { color: var(--orange); font-weight: 600; }
  #summary[data-kind=stopped] { color: var(--red); }
  #settings { grid-column: 2; grid-row: 1 / 3; align-self: start; }
  #go { grid-column: 1 / 3; margin-top: 10px; width: 100%; }
  /* Progress: a bar for the whole sync under the summary, and one under each
     site's line. A bar with no number yet moves in stripes. */
  #allbar { grid-column: 1 / 3; margin-top: 6px; }
  .bar { height: 4px; border-radius: 2px; background: var(--separator); overflow: hidden; }
  .bar > div { height: 100%; width: var(--pct, 0%); min-width: 4px; border-radius: 2px; background: var(--accent); transition: width 400ms ease-out; }
  .bar[data-kind=needs_you] > div { background: var(--orange); }
  .bar[data-kind=bad] > div { background: var(--secondary); }
  .bar[data-unknown] > div { width: 100%; background: repeating-linear-gradient(-45deg, var(--accent) 0 6px, color-mix(in srgb, var(--accent) 45%, transparent) 6px 12px); background-size: 17px 4px; animation: sheen 900ms linear infinite; }
  .progress { grid-column: 2 / 5; display: flex; align-items: center; gap: 8px; margin: 3px 6px 3px 23px; }
  li.has-show .progress { grid-column: 2 / 6; }
  .progress .bar { flex: 1; }
  .progress span { color: var(--secondary); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* At rest, the sites up to date fold into one row. */
  details.fold { border-radius: var(--radius); background: var(--group); box-shadow: 0 0 0 .5px var(--separator); overflow: hidden; }
  details.fold > summary { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; list-style: none; cursor: default; font-size: 13px; line-height: 18px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary:hover { background: var(--hover); }
  details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius); }
  details.fold > summary .ok { flex: none; width: 16px; height: 16px; color: var(--green); }
  details.fold > summary .next { margin-left: auto; color: var(--secondary); font-size: 12px; line-height: 16px; white-space: nowrap; }
  details.fold > summary .chev { flex: none; width: 12px; height: 12px; color: var(--secondary); transition: transform 150ms ease-out; }
  details.fold[open] > summary .chev { transform: rotate(90deg); }
  details.fold > ul { border-radius: 0; box-shadow: none; border-top: 1px solid var(--separator); }
  @media (prefers-reduced-motion: reduce) { details.fold > summary .chev { transition: none; } }
  @keyframes sheen { from { background-position: 0 0; } to { background-position: 17px 0; } }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } .bar[data-unknown] > div { animation: none; } }
  #scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 12px 14px; scrollbar-width: thin; scrollbar-color: var(--separator-strong) transparent; }
  section + section { margin-top: 14px; }
  h2 { margin: 0 4px 5px; color: var(--secondary); font-size: 11px; line-height: 14px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; border-radius: var(--radius); background: var(--group); box-shadow: 0 0 0 .5px var(--separator); overflow: hidden; }
  section[data-state=needs_you] ul { background: var(--orange-tint); box-shadow: 0 0 0 .5px var(--orange-line); }
  li { display: grid; grid-template-columns: 16px 1fr 16px 26px; gap: 0 8px; align-items: center; min-height: 36px; padding: 5px 6px 5px 10px; }
  li + li { border-top: 1px solid var(--separator); }
  li label { display: contents; cursor: default; }
  input[type=checkbox] { width: 14px; height: 14px; margin: 0; }
  .name { grid-column: 2; display: flex; align-items: flex-start; gap: 7px; min-width: 0; font-size: 13px; line-height: 18px; }
  .favicon { flex: none; width: 16px; height: 16px; margin-top: 1px; border-radius: 3px; }
  .state { grid-column: 3; grid-row: 1; width: 16px; height: 16px; }
  .state[data-state=needs_you] { color: var(--orange); }
  .state[data-state=working] { color: var(--secondary); animation: spin 1s linear infinite; }
  .state[data-state=bad] { color: var(--red); }
  .state[data-state=ok] { color: var(--green); }
  .one { grid-column: 4; grid-row: 1; width: 26px; height: 26px; }
  .say { grid-column: 2 / 5; margin: 1px 6px 2px 23px; color: var(--secondary); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; text-wrap: pretty; }
  li.has-show { grid-template-columns: 16px 1fr auto 16px 26px; }
  .show { grid-column: 3; grid-row: 1; min-height: 22px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--hover); color: var(--accent-ink); font-size: 12px; line-height: 16px; font-weight: 500; transition: background-color 150ms ease-out; }
  .show:hover { background: var(--press); }
  li.has-show .state { grid-column: 4; }
  li.has-show .one { grid-column: 5; }
  li.has-show .say { grid-column: 2 / 6; }
  .when { grid-column: 2 / 5; margin: 1px 6px 1px 23px; color: var(--secondary); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; text-wrap: pretty; }
  li.has-show .when { grid-column: 2 / 6; }
  .when[data-need=overdue] { color: var(--red); font-weight: 500; }
  .when[data-need=due], .when[data-need=tax], .when[data-need=gap] { color: var(--orange); font-weight: 500; }
  section[data-state=needs_you] .name { font-weight: 600; }
  section[data-state=needs_you] .say { color: var(--ink); }
  .switched-off .name, .switched-off .when { color: var(--secondary); }
  .when .dismiss { all: unset; cursor: default; color: var(--accent-ink); font-weight: 500; white-space: nowrap; border-radius: 4px; }
  .when .dismiss:hover { text-decoration: underline; }
  .when .dismiss:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Card offers: their own line under the statements' words, and a link to
     the Card Offers page with where they stand. */
  .offers-line { grid-column: 2 / 5; margin: 1px 6px 2px 23px; color: var(--secondary); font-size: 12px; line-height: 16px; font-weight: 500; overflow-wrap: anywhere; text-wrap: pretty; }
  li.has-show .offers-line, li.has-show .pill { grid-column: 2 / 6; }
  .offers-line[data-kind=adding] { color: var(--ink); }
  .offers-line[data-kind=done], .offers-line[data-kind=capped] { color: var(--accent-ink); }
  .offers-line[data-kind=stopped] { color: var(--orange); }
  .pill { grid-column: 2 / 5; justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; margin: 2px 6px 3px 23px; padding: 0 8px; border-radius: 6px; background: var(--hover); color: var(--accent-ink); font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none; }
  .pill svg { flex: none; width: 14px; height: 14px; }
  .pill:hover { background: var(--press); }
  .pill[data-kind=need] { background: var(--orange-tint); color: var(--orange); box-shadow: 0 0 0 .5px var(--orange-line); }
  .pill[data-kind=off] { min-height: 20px; padding: 0; background: none; }
  .pill[data-kind=off]:hover { text-decoration: underline; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--separator); font-size: 12px; line-height: 16px; }
  footer span { color: var(--secondary); }
  footer a { color: var(--accent-ink); font-weight: 500; text-decoration: none; border-radius: 4px; }
  footer a:hover { text-decoration: underline; }
  /* Add This Site, and what it says when a page cannot be added. */
  /* One footer with the card offers row above it, no rule between. */
  #addFoot { flex-wrap: wrap; justify-content: flex-start; }
  #offersFoot:not([hidden]) + #addFoot { border-top: 0; padding-top: 0; }
  #addSite { display: inline-flex; align-items: center; gap: 5px; }
  #addSite svg { width: 14px; height: 14px; }
  #addSay { flex-basis: 100%; text-wrap: pretty; }
  #addSay:empty { display: none; }
  [hidden] { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body>
  <header>
    <h1>Statement Sweep</h1>
    <p id="summary" role="status"></p>
    <button class="icon" id="settings" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6"/><circle cx="10" cy="5" r="1.5"/><circle cx="6" cy="11" r="1.5"/></svg>
    </button>
    <div class="bar" id="allbar" role="progressbar" aria-label="Whole sync" hidden><div></div></div>
    <button class="primary" id="go" type="button">Get New Documents</button>
  </header>
  <main id="scroll" tabindex="-1"></main>
  <footer id="offersFoot" hidden>
    <span id="offersOnCount"></span>
    <a id="offersLink" href="offers.html" target="_blank">Card Offers</a>
  </footer>
  <footer id="addFoot">
    <a id="addSite" href="#" role="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>Add This Site…</a>
    <span id="addSay" role="status"></span>
  </footer>
  <script src="popup.js" type="module"></script>
  <script src="add-site.js" type="module"></script>
</body></html>
