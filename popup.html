<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Statement Sweep</title>
<style>
  :root { color-scheme: light dark; --ink: light-dark(#1d1d1f, #f5f5f7); --muted: light-dark(#6e6e73, #a1a1a6);
    --bg: light-dark(#fff, #2a2a2c); --accent: #0a66d9; --bad: light-dark(#b3261e, #ff8a80); --ok: light-dark(#1b7f3b, #6fdc8c); }
  body { margin: 0; width: 300px; padding: 16px; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  p { margin: 0; }
  #sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  button { width: 100%; min-height: 34px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
  #status { margin-top: 10px; min-height: 20px; }
  #status[data-state=bad] { color: var(--bad); }
  #status[data-state=ok] { color: var(--ok); }
</style></head>
<body>
  <h1>Statement Sweep</h1>
  <p id="sub">Saves your newest statements. Sends nothing anywhere.</p>
  <button id="go" type="button">Get new documents</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js" type="module"></script>
</body></html>
