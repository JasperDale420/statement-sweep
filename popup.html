<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Statement Sweep</title>
<style>
  :root { color-scheme: light dark; --ink: light-dark(#1d1d1f, #f5f5f7); --muted: light-dark(#6e6e73, #a1a1a6);
    --bg: light-dark(#fff, #2a2a2c); --line: light-dark(#e5e5ea, #3a3a3c); --accent: #0a66d9;
    --bad: light-dark(#b3261e, #ff8a80); --ok: light-dark(#1b7f3b, #6fdc8c); --wait: light-dark(#9a5b00, #ffc266); }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--ink);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button.go { width: 100%; min-height: 34px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; margin: 0; padding: 4px 0; max-height: 380px; overflow-y: auto; }
  li { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; padding: 7px 16px; align-items: center; }
  li label { display: contents; }
  .say { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
  li[data-state=bad] .say { color: var(--bad); }
  li[data-state=ok] .say { color: var(--ok); }
  li[data-state=needs_you] .say { color: var(--wait); font-weight: 600; }
  .one { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
</style></head>
<body>
  <header><h1>Statement Sweep</h1><button class="go" id="go" type="button">Get new documents</button></header>
  <ul id="list"></ul>
  <script src="popup.js" type="module"></script>
</body></html>
